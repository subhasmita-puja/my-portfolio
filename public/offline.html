<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Offline | Subhasmita Sahoo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background: #0a0a0a;
      color: white;

      text-align: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .icon {
      width: 90px;
      height: 90px;

      margin: 0 auto 30px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 40px;

      background: linear-gradient(
        135deg,
        #d946ef,
        #8b5cf6
      );

      box-shadow:
        0 0 30px rgba(217, 70, 239, 0.5);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #e879f9,
        #a855f7
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #9ca3af;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    button {
      border: 2px solid #d946ef;

      background: transparent;

      color: white;

      padding: 12px 28px;

      border-radius: 999px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(
        90deg,
        #d946ef,
        #8b5cf6
      );

      box-shadow:
        0 0 25px rgba(217, 70, 239, 0.5);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">
      ⚡
    </div>

    <h1>You're Offline</h1>

    <p>
      It looks like your internet connection is unavailable.
      Some external features may not work until you're back online.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>

  </div>

</body>
</html>
